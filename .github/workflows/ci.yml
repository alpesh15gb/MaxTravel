# Push and PR checks use synthetic databases and loopback services.
# Installation/build generate both SQLite and PostgreSQL clients.
# Verify covers types, lint, dependency audit and recovery contracts; other jobs
# cover production build, API/security/reporting flows and responsive browsers.
# Browser comparisons share one fixture contract without relaxing accessibility
# or layout budgets. No job holds live provider credentials or migrates live data.
# Docker packaging and isolated Linux startup/migration checks are in production-image.yml.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "file:./ci.db"
  JWT_SECRET: "ci-only-placeholder-secret-not-used-anywhere-real-0123456789abcdef"

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify employee recovery outcome and generation contracts
        run: node --import tsx tests/employee-recovery.ts
      - name: Verify owner-requested CRM reset and recovery protections
        run: python3 -B -m unittest discover -s tests -p test_vps_reset_crm.py
      - name: Verify populated messaging retirement preserves business documents
        run: python3 -B tests/retire-messaging.py

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build

  test:
    name: Smoke suite and accessibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Install the Chromium the audit drives
        run: npx playwright install --with-deps chromium
      - name: Build for the audit
        id: audit_build
        run: npm run build
      - name: Run the test chain
        run: npm test
      - name: Verify private Masters, internal chat and agency daily-work browsers
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        run: |
          npm run test:masters
          npm run test:chat
          npm run test:agency-browser
      - name: Verify report filters, metadata, permissions and responsive details
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: node tests/reporting-browser.mjs
      - name: Verify package editor and publication journeys
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        run: npm run test:travel-packages-browser
      - name: Verify complete agency journeys
        id: agency_journeys
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        run: npm run test:journeys
      - name: Verify reviewed client and case imports on desktop and mobile
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        run: npm run test:imports
      - name: Verify contiguous customer proposal acceptance to CRM booking
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: node tests/sales-complete-journey-browser.mjs
      - name: Verify scoped online booking queue and responsive action recovery
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          node --test tests/fixture-lifecycle.test.mjs
          node --import tsx tests/platform-action-guidance.mts
          node --import tsx tests/online-bookings-query.mts --browser
      - name: Verify scoped staff recovery HTTP contracts
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: node --import tsx tests/employee-recovery-http.mts
      - name: Verify staff lost-response and duplicate-submit recovery
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 6
        run: node tests/employee-recovery-browser.mjs
      - name: Verify task-first mobile workspace journeys
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        run: node tests/mobile-workspace-browser.mjs
      - name: Verify three consecutive cancellation UI settlements
        if: ${{ !cancelled() && steps.agency_journeys.outcome == 'success' }}
        env:
          DATABASE_URL: "file:./ticketing-journey-verification.db"
          TICKETING_BROWSER: "true"
        run: |
          set -e
          for iteration in 1 2 3; do
            echo "Cancellation UI stability observation ${iteration}/3"
            node --import tsx tests/ticketing-journey.mts
          done
      - name: Collect UI diagnostics after a failed test chain
        if: failure()
        run: node tests/ui-metrics.mjs
      - name: Upload the test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-artifacts/ui/
            test-artifacts/ui-gate-server.log
            test-artifacts/reporting/
            test-artifacts/journeys/
            test-artifacts/sales-complete-journey/
            test-artifacts/mobile-workspace/
            test-artifacts/employee-recovery/
            test-artifacts/employee-recovery-http/
            test-artifacts/online-bookings/
            test-artifacts/travel-packages/
            test-artifacts/a11y/report.json
            test-artifacts/a11y/report.md
            test-artifacts/a11y/gate.json
            test-artifacts/a11y/login-failure.json
            test-artifacts/a11y/login-failure.png
            test-artifacts/a11y-gate-server.log
            tests/.runtime/latest.json
            docs/verification-results.json
          if-no-files-found: warn

  booking-platform-receiver:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./integration-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Verify signed receiver and accounting in an isolated database
        run: |
          node --import tsx tests/platform-cancellation-tracking.mts
          node --import ./scripts/standalone-server.mjs --import tsx tests/platform-receiver.mts

      - name: Verify automatic signed booking PDFs and stale-document suppression
        run: node --import ./scripts/standalone-server.mjs --import tsx tests/platform-documents.mts

  staff-sales-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./security-verification.db
      APP_ORIGIN: http://127.0.0.1:3217
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Create an isolated database file
        run: node -e "require('node:fs').writeFileSync('prisma/security-verification.db','',{flag:'wx'})"
      - run: npm run db:migrate
      - run: npm run test:travel-packages
      - run: npm run test:package-media
      - run: npm run test:crm-core
      - run: npm run build
      - run: node --import tsx tests/sales-discovery.mts
      - run: npm run test:staff-sales

  studio-visual-comparison:
    name: Studio visual evidence (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            ref: ea2850256584c1cde9d10d27ae7d0e219655f6db
          - label: after
            ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app
      - name: Get the exact same comparison harness for both revisions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: comparison-harness
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture isolated fixture screenshots at 1440, 1024 and 390 pixels
        env:
          STUDIO_LABEL: ${{ matrix.label }}
        run: |
          cp ../comparison-harness/tests/visual-review-server.mjs tests/visual-review-server.mjs
          cp ../comparison-harness/tests/studio-visual-comparison.mjs tests/studio-visual-comparison.mjs
          node tests/studio-visual-comparison.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.label }}
          path: app/test-artifacts/studio/
          if-no-files-found: warn
