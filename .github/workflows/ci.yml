# Continuous integration for this workspace.
#
# WHERE THIS FILE BELONGS
# It must sit at the root of the Git repository — the same directory as package.json. This machine
# has no Git metadata (no .git), so the workflow has never executed here; the YAML itself was
# validated with `npx js-yaml .github/workflows/ci.yml`. A human must confirm the run on a branch.
# Either push the branch and watch the Actions run, or reproduce the three jobs by hand from the
# repository root:
#
#   npm ci && npx prisma generate && npm run typecheck && npm run lint
#   npm run build
#   npx playwright install --with-deps chromium && npm test
#
# WHAT EACH JOB PROVES
#   verify  — the tree typechecks (tsc --noEmit) and lints (next lint). Prisma's client is generated
#             first because the TypeScript types for the database come from `prisma generate`, and a
#             fresh checkout has no generated client.
#   build   — the app compiles. Every route in the route table is dynamic (`ƒ`), so `next build` does
#             not prerender or query anything: no database is needed and none is provided. The
#             DATABASE_URL and JWT_SECRET below are throwaway CI values, never real credentials, and
#             JWT_SECRET is well over 32 characters because the session signer rejects anything shorter.
#   test    — the project's own chain, exactly as `npm test` defines it: tests/smoke.mjs (isolated
#             SQLite database and upload root under tests/.runtime/) and then tests/a11y-gate.mjs,
#             which audits the build made by the previous step and exits non-zero if any finding
#             falls outside tests/a11y-budget.json. Both suites start and stop their own servers on
#             loopback ports and leave the machine clean.
#
# PREREQUISITES A HUMAN MUST KEEP TRUE
#   • npm ci requires package-lock.json to be in sync with package.json. Adding a dependency without
#     updating the lockfile fails this job immediately and deliberately.
#   • Playwright is a declared devDependency pinned in package-lock.json (1.63.0), so `npm ci`
#     installs it and `npx playwright install` fetches the browser for exactly that version. The
#     harnesses load it through tests/browser.mjs, which prefers the project's copy — the path this
#     workflow exercises — and falls back to a vendored copy for local setups that have one.
#   • The build runs before the tests because both the smoke suite (`next start`) and the
#     accessibility gate require a build, and the gate refuses one older than src/.
#
# DELIBERATELY NOT HERE
#   • No migration is applied against a real database: this workflow has no database and no
#     credentials, and migrating a live database is a deployment step, not a pull-request check.
#     That the migrations apply cleanly to an *empty* database is already proven by the test job —
#     tests/smoke.mjs builds its throwaway SQLite file with `prisma migrate deploy`, so a migration
#     that cannot run from scratch fails this pipeline.
#   • Not wired: tests/implementation-verify.mjs, tests/client-audit.mjs, tests/responsive-review.mjs
#     and tests/visa-board-verify.mjs. They assert against their own review servers and fixtures and
#     are run by hand; `npm test` — the chain this job runs — is the project's defined gate.
#   • No deploys, no secrets, no third-party services.
#
# RUNS TWICE ON A PULL-REQUEST BRANCH, ON PURPOSE: `push` covers every branch, so a branch with no
# pull request still gets checked, and `pull_request` then re-checks the merge result. The default
# branch name is not assumed here, because this machine cannot read the repository's Git metadata.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "file:./ci.db"
  JWT_SECRET: "ci-only-placeholder-secret-not-used-anywhere-real-0123456789abcdef"

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify employee recovery outcome and generation contracts
        run: node --import tsx tests/employee-recovery.ts

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build

  test:
    name: Smoke suite and accessibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Install the Chromium the audit drives
        run: npx playwright install --with-deps chromium
      - name: Build for the audit
        id: audit_build
        run: npm run build
      - name: Run the test chain
        run: npm test
      - name: Verify report filters, metadata, permissions and responsive details
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: node tests/reporting-browser.mjs
      - name: Verify package editor and publication journeys
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        run: npm run test:travel-packages-browser
      - name: Verify complete agency journeys
        id: agency_journeys
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        run: npm run test:journeys
      - name: Verify contiguous customer proposal acceptance to CRM booking
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: node tests/sales-complete-journey-browser.mjs
      - name: Verify scoped online booking queue and responsive action recovery
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          node --test tests/fixture-lifecycle.test.mjs
          node --import tsx tests/platform-action-guidance.mts
          node --import tsx tests/online-bookings-query.mts --browser
      - name: Verify recipient-bound WhatsApp composer races
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          npm run test:whatsapp-idempotency
          npm run test:whatsapp-browser
      - name: Verify scoped staff recovery HTTP contracts
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 5
        run: node --import tsx tests/employee-recovery-http.mts
      - name: Verify staff lost-response and duplicate-submit recovery
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        timeout-minutes: 6
        run: node tests/employee-recovery-browser.mjs
      - name: Verify task-first mobile workspace journeys
        if: ${{ !cancelled() && steps.audit_build.outcome == 'success' }}
        run: node tests/mobile-workspace-browser.mjs
      - name: Verify three consecutive cancellation UI settlements
        if: ${{ !cancelled() && steps.agency_journeys.outcome == 'success' }}
        env:
          DATABASE_URL: "file:./ticketing-journey-verification.db"
          TICKETING_BROWSER: "true"
        run: |
          set -e
          for iteration in 1 2 3; do
            echo "Cancellation UI stability observation ${iteration}/3"
            node --import tsx tests/ticketing-journey.mts
          done
      - name: Collect UI diagnostics after a failed test chain
        if: failure()
        run: node tests/ui-metrics.mjs
      - name: Upload the test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-artifacts/ui/
            test-artifacts/ui-gate-server.log
            test-artifacts/reporting/
            test-artifacts/journeys/
            test-artifacts/sales-complete-journey/
            test-artifacts/mobile-workspace/
            test-artifacts/whatsapp-recipient-context/
            test-artifacts/whatsapp-manual-idempotency/
            test-artifacts/employee-recovery/
            test-artifacts/employee-recovery-http/
            test-artifacts/online-bookings/
            test-artifacts/travel-packages/
            test-artifacts/a11y/report.json
            test-artifacts/a11y/report.md
            test-artifacts/a11y/gate.json
            test-artifacts/a11y/login-failure.json
            test-artifacts/a11y/login-failure.png
            test-artifacts/a11y-gate-server.log
            tests/.runtime/latest.json
            docs/verification-results.json
          if-no-files-found: warn

  booking-platform-receiver:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./integration-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Verify signed receiver and accounting in an isolated database
        run: node --import ./scripts/standalone-server.mjs --import tsx tests/platform-receiver.mts

      - name: Verify Meta Cloud API policies and signed delivery callbacks
        run: node --import ./scripts/standalone-server.mjs --import tsx tests/meta-cloud.mts
      - name: Verify private WhatsApp PDFs and document-header delivery
        run: node --import ./scripts/standalone-server.mjs --import tsx tests/meta-pdf.mts

      - name: Verify automatic signed booking PDFs and stale-document suppression
        run: node --import ./scripts/standalone-server.mjs --import tsx tests/platform-documents.mts

  staff-sales-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./security-verification.db
      APP_ORIGIN: http://127.0.0.1:3217
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Create an isolated database file
        run: node -e "require('node:fs').writeFileSync('prisma/security-verification.db','',{flag:'wx'})"
      - run: npm run db:migrate
      - run: npm run test:travel-packages
      - run: npm run test:package-media
      - run: npm run test:crm-core
      - run: npm run build
      - run: node --import tsx tests/sales-discovery.mts
      - run: npm run test:staff-sales

  studio-visual-comparison:
    name: Studio visual evidence (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            ref: ea2850256584c1cde9d10d27ae7d0e219655f6db
          - label: after
            ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app
      - name: Get the exact same comparison harness for both revisions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: comparison-harness
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture isolated fixture screenshots at 1440, 1024 and 390 pixels
        env:
          STUDIO_LABEL: ${{ matrix.label }}
          WA_PROVIDER: manual
        run: |
          cmp tests/visual-review-server.mjs ../comparison-harness/tests/visual-review-server.mjs
          cp ../comparison-harness/tests/studio-visual-comparison.mjs tests/studio-visual-comparison.mjs
          node tests/studio-visual-comparison.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.label }}
          path: app/test-artifacts/studio/
          if-no-files-found: warn
