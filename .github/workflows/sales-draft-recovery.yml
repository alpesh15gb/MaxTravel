# Additional isolated browser gate. Complete CI remains mandatory before promotion.
name: Sales draft recovery
on:
  workflow_dispatch:
  push:
    # Candidate branches must prove the same recovery contract before main promotion.
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sales-draft-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-only-draft-recovery-fixture-secret-0123456789abcdef"
      WA_PROVIDER: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - name: Verify bounded memory and revision contracts
        run: |
          node --import tsx tests/sales-draft-memory.ts
          node --import tsx tests/sales-recovery-context.ts
          node --import tsx tests/sales-workspace.ts
          node --import tsx tests/enquiry-customer.ts
          node --import tsx tests/customer-create-memory.ts
          node --import tsx tests/sales-action-memory.ts
          node tests/sales-handoff-controller.mjs
      - run: npm run build
      - name: Verify customer creation is bound to the originating staff session
        env:
          CUSTOMER_CONTEXT_USE_BUILD: "1"
        run: node --import tsx tests/customer-creation-context.mts
      - name: Verify real Back/Forward, scoped recovery, unknown writes and mobile keyboard
        timeout-minutes: 10
        run: node tests/sales-draft-recovery-browser.mjs
      - name: Retain failures and actual keyboard recovery screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-draft-recovery
          path: |
            test-artifacts/sales-draft-recovery/
            test-artifacts/customer-context/
          if-no-files-found: warn
          retention-days: 14
