name: Deployment helpers offline checks

on:
  push:
    branches:
      - ops/deploy-20261024
    paths:
      - ops/deploy-20261024/**
      - .github/workflows/deploy-helpers.yml

permissions:
  contents: read

jobs:
  offline-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: ops/deploy-20261024
    steps:
      - name: Read exact helper revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Bash syntax without executing deployment scripts
        run: bash -n preserve-build.sh revalidate-built-crm.sh collect-preflight.sh
      - name: Run offline validator and recovery regressions
        run: python3 -m unittest -v test_verify.py test_revalidate.py
