name: Scoped new-main deployment helper checks

on:
  push:
    branches:
      - ops/candidate-20261025
    paths:
      - ops/deploy-20261025-candidate/**
      - .github/workflows/deploy-helpers-candidate.yml

permissions:
  contents: read

jobs:
  offline-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: ops/deploy-20261025-candidate
    steps:
      - name: Read exact helper revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exported helper and phase file manifests
        run: |
          sha256sum --check SHA256SUMS
          (cd cutover && sha256sum --check draft.sha256)
      - name: Check every Bash script without executing deployment scripts
        run: |
          for script in preserve-build.sh revalidate-built-crm.sh collect-preflight.sh test_snapshot_docker.sh test_compose_replace_docker.sh test_postgres_startup_docker.sh cutover/*.sh; do
            bash -n "$script"
          done
      - name: Check isolated audit JavaScript syntax without executing audits
        run: |
          for script in cutover/audit-crm.cjs cutover/audit-tree.cjs; do
            node --check "$script"
          done
      - name: Run offline validator and recovery regressions
        run: python3 -m unittest -v test_verify.py test_revalidate.py test_candidate.py test_failed_booking_helper.py
      - name: Run offline phase regressions without Docker or VPS access
        run: |
          python3 cutover/test_phase_offline.py
          python3 cutover/test_booking_offline.py

  docker-cli-snapshot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
        working-directory: ops/deploy-20261025-candidate
    steps:
      - name: Read exact helper revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify smoke and helper payloads
        run: sha256sum --check SHA256SUMS
      - name: Exercise real Docker snapshot CLI on owned never-started fixtures
        env:
          SNAPSHOT_DOCKER_SMOKE: owned-synthetic-only
        run: bash test_snapshot_docker.sh

  docker-compose-replacement-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
        working-directory: ops/deploy-20261025-candidate
    steps:
      - name: Read exact helper revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify smoke and helper payloads
        run: sha256sum --check SHA256SUMS
      - name: Verify real Compose replacement metadata with never-started owned fixtures
        env:
          COMPOSE_REPLACE_SMOKE: owned-synthetic-only
        run: bash test_compose_replace_docker.sh

  postgres-isolated-startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
        working-directory: ops/deploy-20261025-candidate
    steps:
      - name: Read exact helper revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify helper payloads
        run: sha256sum --check SHA256SUMS
      - name: Exercise actual isolated PostgreSQL startup with both Unix sockets
        env:
          POSTGRES_STARTUP_SMOKE: owned-synthetic-only
        run: bash test_postgres_startup_docker.sh
