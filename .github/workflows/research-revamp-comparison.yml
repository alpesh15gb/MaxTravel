# An additional visual gate, never a replacement for the complete CI/security/journey workflows.
name: Research revamp comparison
on:
  workflow_dispatch:
  push:
    branches: [feat/crm-research-revamp]
permissions:
  contents: read
concurrency:
  group: research-revamp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    name: Workspace ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-only-research-fixture-not-a-real-secret-0123456789abcdef"
      WA_PROVIDER: manual
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ matrix.version == 'before' && 'f863ce6fbb3d8534a35261154e8aaabc3d54128e' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - name: Build exact application revision before adding comparison harness
        run: npm run build
      - uses: actions/checkout@v4
        with:
          path: comparison-harness
          ref: ${{ github.sha }}
          sparse-checkout: |
            tests/research-revamp-browser.mjs
            tests/visual-review-server.mjs
            tests/fixture-lifecycle.mjs
            tests/browser.mjs
          sparse-checkout-cone-mode: false
      - name: Use identical fixture definitions and observer on both revisions
        run: |
          cp ../comparison-harness/tests/research-revamp-browser.mjs tests/
          cp ../comparison-harness/tests/visual-review-server.mjs tests/
          cp ../comparison-harness/tests/fixture-lifecycle.mjs tests/
          cp ../comparison-harness/tests/browser.mjs tests/
          sha256sum tests/research-revamp-browser.mjs tests/visual-review-server.mjs
      - name: Verify pure sales workspace lifecycle
        if: matrix.version == 'after'
        run: |
          node --import tsx tests/sales-workspace.ts
          node tests/dashboard-concurrency.mjs
      - name: Compare real task surfaces without real customer/provider access
        timeout-minutes: 9
        env:
          RESEARCH_COMPARISON: ${{ matrix.version }}
        run: node --import tsx tests/research-revamp-browser.mjs
      - name: Retain baseline, candidate geometry, screenshots and original failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-revamp-${{ matrix.version }}
          path: app/test-artifacts/research-revamp/
          if-no-files-found: warn
          retention-days: 14
