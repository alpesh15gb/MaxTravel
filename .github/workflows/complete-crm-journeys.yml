name: Complete CRM operational journeys
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/complete-crm-journeys.yml'
      - 'src/app/(app)/customer-tools/CustomerTools.tsx'
      - 'src/app/(app)/payments/print/**'
      - 'tests/financial-document-layout-browser.mjs'
      - 'tests/fresh-setup-complete-journey-browser.mjs'
      - 'src/app/setup/**'
      - 'src/app/api/setup/route.ts'
      - 'tests/synthetic-ui-journey-fixture.mjs'
      - 'tests/money-complete-journey-browser.mjs'
      - 'tests/customer-data-complete-journey-browser.mjs'
      - 'tests/customer-import-race-browser.mjs'
      - 'tests/customer-import-pending-browser.mjs'
      - 'tests/operations-complete-journey-browser.mjs'
      - 'tests/records-complete-journey-browser.mjs'
      - 'tests/auth-complete-journey-browser.mjs'
      - 'tests/incoming-media-complete-journey-browser.mjs'
      - 'tests/incoming-media-provider-preload.mjs'
permissions:
  contents: read
concurrency:
  group: complete-crm-journeys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: 'file:./ci.db'
      JWT_SECRET: 'ci-only-complete-journey-fixture-no-real-secret-0123456789abcdef'
      WA_PROVIDER: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - name: Build exact candidate
        id: build
        run: npm run build
      - name: Ticket receipt advance refund and supplier complete UI lifecycles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/money-complete-journey-browser.mjs
      - name: Preserve money-complete-journey evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: money-complete-journey-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/money-complete-journey/
          if-no-files-found: warn
          retention-days: 14
      - name: Customer import consolidation and public document approval UI lifecycles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/customer-data-complete-journey-browser.mjs
      - name: Preserve customer-data-complete-journey evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: customer-data-complete-journey-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/customer-data-complete-journey/
          if-no-files-found: warn
          retention-days: 14
      - name: Tasks and operational settings complete UI lifecycles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/operations-complete-journey-browser.mjs
      - name: Preserve operations-complete-journey evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: operations-complete-journey-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/operations-complete-journey/
          if-no-files-found: warn
          retention-days: 14
      - name: Invoice credit traveller and visa checklist UI lifecycles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/records-complete-journey-browser.mjs
      - name: Preserve records-complete-journey evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: records-complete-journey-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/records-complete-journey/
          if-no-files-found: warn
          retention-days: 14
      - name: Synthetic staff MFA session and account recovery UI lifecycles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/auth-complete-journey-browser.mjs
      - name: Preserve auth-complete-journey evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: auth-complete-journey-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/auth-complete-journey/
          if-no-files-found: warn
          retention-days: 14
      - name: Local provider fixture incoming document UI lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/incoming-media-complete-journey-browser.mjs
      - name: Preserve incoming-media-complete-journey evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: incoming-media-complete-journey-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/incoming-media-complete-journey/
          if-no-files-found: warn
          retention-days: 14
      - name: CSV replacement invalidates stale preview before reading or rejection
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/customer-import-race-browser.mjs
      - name: Preserve customer-import-race evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: customer-import-race-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/customer-import-race/
          if-no-files-found: warn
          retention-days: 14
      - name: Pending customer import locks consolidation until exact retry resolves
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/customer-import-pending-browser.mjs
      - name: Preserve customer-import-pending evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: customer-import-pending-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/customer-import-pending/
          if-no-files-found: warn
          retention-days: 14
      - name: Financial documents mobile layout and actual A4 PDF output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/financial-document-layout-browser.mjs
      - name: Preserve financial-document-layout evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: financial-document-layout-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/financial-document-layout/
          if-no-files-found: warn
          retention-days: 14
      - name: Empty database first-owner setup and replay protection UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 7
        run: node tests/fresh-setup-complete-journey-browser.mjs
      - name: Preserve fresh-setup-complete-journey evidence immediately
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-setup-complete-journey-${{ github.sha }}-${{ github.run_id }}
          path: test-artifacts/fresh-setup-complete-journey/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve original failures and exact completed-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-crm-journeys-${{ github.sha }}-${{ github.run_id }}
          path: |
            test-artifacts/money-complete-journey/
            test-artifacts/customer-data-complete-journey/
            test-artifacts/customer-import-race/
            test-artifacts/customer-import-pending/
            test-artifacts/financial-document-layout/
            test-artifacts/fresh-setup-complete-journey/
            test-artifacts/operations-complete-journey/
            test-artifacts/records-complete-journey/
            test-artifacts/auth-complete-journey/
            test-artifacts/incoming-media-complete-journey/
          if-no-files-found: warn
          retention-days: 14
