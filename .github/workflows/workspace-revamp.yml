name: CRM daily-work experience
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/workspace-*"
      - "tests/visual-review-server.mjs"
      - "package*.json"
      - ".github/workflows/workspace-revamp.yml"
permissions:
  contents: read
jobs:
  daily-work:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./build-verification.db
      JWT_SECRET: isolated-ci-build-secret-with-at-least-32-characters
      WA_PROVIDER: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:workspace-revamp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-daily-work-review
          path: test-artifacts/crm-revamp-2026-10-30
          retention-days: 14
